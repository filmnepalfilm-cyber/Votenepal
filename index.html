        localStorage.setItem('global_nepal_poll_votes_v4', JSON.stringify(votes));
      }, [votes]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setCandPhoto(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleRegisterCandidate = (e) => {
        e.preventDefault();
        setRegMsg('');

        if (!candName || !candParty || !candProvince || !candDistrict) {
          setRegMsg('कृपया नाम, पार्टी, प्रदेश र जिल्ला पूरा भर्नुहोस्।');
          return;
        }

        const newCand = {
          id: 'custom_' + Date.now(),
          name: candName.trim(),
          party: candParty.trim(),
          province: candProvince,
          district: candDistrict,
          photo: candPhoto || null,
          symbol: '👤',
          isCustom: true
        };

        setCandidates([newCand, ...candidates]);
        setRegMsg('बधाई छ! तपाईंको उम्मेदवारी सफलतापूर्वक दर्ता भयो। अब सबैले तपाईंलाई भोट हाल्न सक्नेछन्।');
        setCandName('');
        setCandParty('');
        setCandPhoto(null);
      };

      const handleVoteSubmit = (e) => {
        e.preventDefault();
        setStatusMsg('');

        if (!email.trim() || !province || !district || !localBody || !selectedParty) {
          setStatusMsg('कृपया इमेल, प्रदेश, जिल्ला, पालिका र उम्मेदवार सबै छान्नुहोस्।');
          return;
        }

        const existing = votes.find(v => v.email.toLowerCase() === email.toLowerCase());
        if (existing) {
          setStatusMsg('यो इमेलबाट पहिले नै मतदान भइसकेको छ।');
          return;
        }

        setShowStamp(true);

        setTimeout(() => {
          const newVote = {
            id: Date.now(),
            email: email.trim().toLowerCase(),
            province,
            district,
            localBody,
            partyId: selectedParty,
            timestamp: new Date().toLocaleString('ne-NP')
          };

          setVotes([...votes, newVote]);
          setStatusMsg('तपाईंको मत स्वस्तिका छापसहित सफलतापूर्वक दर्ता भयो!');
          setEmail('');
          setSelectedParty('');
          setShowStamp(false);
        }, 800);
      };

      const getFilteredVotes = () => {
        return votes.filter(v => {
          if (filterProvince && v.province !== filterProvince) return false;
          if (filterDistrict && v.district !== filterDistrict) return false;
          if (filterLocalBody && v.localBody !== filterLocalBody) return false;
          return true;
        });
      };

      const filteredVotes = getFilteredVotes();
      const totalFilteredVotes = filteredVotes.length;

      const getCandidateFilteredCount = (candId) => {
        return filteredVotes.filter(v => v.partyId === candId).length;
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-8">
          <header className="text-center mb-8">
            <div className="inline-block bg-pink-100 text-pink-700 font-bold px-4 py-1 rounded-full text-xs md:text-sm mb-2 border border-pink-200">
              नेपाल ७७ वटै जिल्ला • स्वस्तिका छाप सहित पालिका नतिजा
            </div>
            <h1 className="text-3xl md:text-5xl font-extrabold text-pink-700 tracking-tight">
              नेपाल जनमत तथा पालिका निर्वाचन पोर्टेल
            </h1>
            <p className="text-slate-600 mt-2 text-sm md:text-base">
              ७७ वटै जिल्लाका पालिका अनुसार मतदान गर्नुहोस् र लाइभ नतिजा हेर्नुहोस्!
            </p>
          </header>

          <div className="flex flex-wrap justify-center gap-2 mb-8 border-b border-pink-200 pb-3">
            <button
              onClick={() => setActiveTab('poll')}
              className={`px-5 py-2.5 rounded-xl font-bold transition-all ${
                activeTab === 'poll'
                  ? 'bg-pink-600 text-white shadow-lg shadow-pink-200'
                  : 'bg-white text-slate-600 hover:bg-pink-50'
              }`}
            >
              🗳️ मतदान गर्नुहोस्
            </button>

            <button
              onClick={() => setActiveTab('register')}
              className={`px-5 py-2.5 rounded-xl font-bold transition-all ${
                activeTab === 'register'
                  ? 'bg-pink-600 text-white shadow-lg shadow-pink-200'
                  : 'bg-white text-slate-600 hover:bg-pink-50'
              }`}
            >
              🙋‍♂️ उम्मेदवार दर्ता
            </button>

            <button
              onClick={() => setActiveTab('results')}
              className={`px-5 py-2.5 rounded-xl font-bold transition-all ${
                activeTab === 'results'
                  ? 'bg-pink-600 text-white shadow-lg shadow-pink-200'
                  : 'bg-white text-slate-600 hover:bg-pink-50'
              }`}
            >
              📊 पालिका अनुसारको नतिजा
            </button>
          </div>

          {activeTab === 'poll' && (
            <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-pink-100 relative overflow-hidden">
              {statusMsg && (
                <div className={`p-4 rounded-xl mb-6 font-semibold text-center ${
                  statusMsg.includes('सफलतापूर्वक') 
                    ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' 
                    : 'bg-rose-50 text-rose-700 border border-rose-200'
                }`}>
                  {statusMsg}
                </div>
              )}

              <form onSubmit={handleVoteSubmit} className="space-y-6">
                <div>
                  <label className="block text-slate-700 font-bold mb-2">१. तपाईंको इमेल ठेगाना</label>
                  <input
                    type="email"
                    required
                    placeholder="yourname@gmail.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20"
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-slate-700 font-bold mb-2">२. प्रदेश छान्नुहोस्</label>
                    <select
                      value={province}
                      onChange={(e) => { setProvince(e.target.value); setDistrict(''); setLocalBody(''); }}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20"
                    >
                      <option value="">-- प्रदेश --</option>
                      {Object.keys(NEPAL_DATA).map(p => (
                        <option key={p} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-2">३. जिल्ला (७७ जिल्ला)</label>
                    <select
                      value={district}
                      disabled={!province}
                      onChange={(e) => { setDistrict(e.target.value); setLocalBody(''); }}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20 disabled:bg-slate-100"
                    >
                      <option value="">-- जिल्ला --</option>
                      {province && Object.keys(NEPAL_DATA[province] || {}).map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-2">४. नगरपालिका / गाउँपालिका</label>
                    <select
                      value={localBody}
                      disabled={!district}
                      onChange={(e) => setLocalBody(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20 disabled:bg-slate-100"
                    >
                      <option value="">-- पालिका --</option>
                      {district && (NEPAL_DATA[province]?.[district] || []).map(l => (
                        <option key={l} value={l}>{l}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-700 font-bold mb-3">५. मत हाल्न उम्मेदवार वा पार्टी छान्नुहोस्</label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {candidates.map(cand => {
                      const isSelected = selectedParty === cand.id;
                      return (
                        <div
                          key={cand.id}
                          onClick={() => setSelectedParty(cand.id)}
                          className={`p-4 rounded-2xl border-2 cursor-pointer relative overflow-hidden flex items-center space-x-3 transition-all ${
                            isSelected
                              ? 'border-pink-600 bg-pink-50 shadow-md scale-102'
                              : 'border-slate-100 hover:border-pink-300 bg-white'
                          }`}
                        >
                          {isSelected && (
                            <div className="absolute right-2 bottom-2 text-rose-600 opacity-80 animate-stamp font-black text-2xl flex flex-col items-center">
                              <span className="text-3xl leading-none">卐</span>
                              <span className="text-[9px] uppercase tracking-tighter text-rose-700">स्वस्तिका छाप</span>
                            </div>
                          )}

                          {cand.photo ? (
                            <img src={cand.photo} alt={cand.name} className="w-12 h-12 rounded-full object-cover border-2 border-pink-400" />
                          ) : (
                            <div className="w-12 h-12 rounded-full bg-pink-100 flex items-center justify-center text-2xl">
                              {cand.symbol}
                            </div>
                          )}
                          <div>
                            <div className="font-bold text-slate-800 text-sm">{cand.name}</div>
                            <div className="text-xs text-pink-600 font-medium">पार्टी: {cand.party}</div>
                            {cand.isCustom && (
                              <div className="text-[10px] text-slate-400">{cand.district}, {cand.province}</div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={showStamp}
                  className="w-full py-4 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-extrabold text-lg rounded-xl hover:from-pink-700 hover:to-rose-700 shadow-lg shadow-pink-200 transition-all relative flex items-center justify-center space-x-2"
                >
                  <span>स्वस्तिका छाप लगाई मत पेश गर्नुहोस् (Submit Vote)</span>
                  {showStamp && <span className="animate-spin text-2xl">卐</span>}
                </button>
              </form>
            </div>
          )}

          {activeTab === 'register' && (
            <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-pink-100 max-w-2xl mx-auto">
              <h2 className="text-2xl font-bold text-slate-800 mb-2 text-center">उम्मेदवार दर्ता फारम</h2>
              <p className="text-slate-500 text-sm text-center mb-6">आफ्नो नाम, फोटो र पार्टी राखी डिजिटल चुनावमा प्रतिस्पर्धा गर्नुहोस्</p>

              {regMsg && (
                <div className={`p-4 rounded-xl mb-6 font-semibold text-center ${
                  regMsg.includes('बधाई') 
                    ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' 
                    : 'bg-rose-50 text-rose-700 border border-rose-200'
                }`}>
                  {regMsg}
                </div>
              )}

              <form onSubmit={handleRegisterCandidate} className="space-y-5">
                <div>
                  <label className="block text-slate-700 font-bold mb-2">१. उम्मेदवारको नाम</label>
                  <input
                    type="text"
                    required
                    placeholder="जस्तै: राम श्रेष्ठ"
                    value={candName}
                    onChange={(e) => setCandName(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20"
                  />
                </div>

                <div>
                  <label className="block text-slate-700 font-bold mb-2">२. पार्टी वा समूहको नाम</label>
                  <input
                    type="text"
                    required
                    placeholder="जस्तै: स्वतन्त्र युवा अभियान"
                    value={candParty}
                    onChange={(e) => setCandParty(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20"
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-slate-700 font-bold mb-2">३. प्रदेश</label>
                    <select
                      value={candProvince}
                      onChange={(e) => { setCandProvince(e.target.value); setCandDistrict(''); }}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20"
                    >
                      <option value="">-- प्रदेश --</option>
                      {Object.keys(NEPAL_DATA).map(p => (
                        <option key={p} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-700 font-bold mb-2">४. जिल्ला</label>
                    <select
                      value={candDistrict}
                      disabled={!candProvince}
                      onChange={(e) => setCandDistrict(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-500 bg-pink-50/20 disabled:bg-slate-100"
                    >
                      <option value="">-- जिल्ला --</option>
                      {candProvince && Object.keys(NEPAL_DATA[candProvince] || {}).map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-700 font-bold mb-2">५. फोटो (Optional Photo)</label>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleImageUpload}
                    className="w-full px-4 py-2 border border-pink-200 rounded-xl bg-pink-50/20 text-slate-600"
                  />
                  {candPhoto && (
                    <div className="mt-3 flex items-center space-x-3">
                      <img src={candPhoto} alt="Preview" className="w-16 h-16 rounded-full object-cover border-2 border-pink-500" />
                      <span className="text-xs text-emerald-600 font-bold">फोटो तयार भयो!</span>
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold text-lg rounded-xl hover:from-emerald-700 hover:to-teal-700 shadow-lg shadow-emerald-100 transition-all"
                >
                  उम्मेदवार दर्ता गर्नुहोस्
                </button>
              </form>
            </div>
          )}

          {activeTab === 'results' && (
            <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-pink-100">
              <div className="mb-6 border-b pb-6">
                <h2 className="text-2xl font-bold text-slate-800 mb-1">नगरपालिका / गाउँपालिका नतिजा</h2>
                <p className="text-slate-500 text-sm mb-4">स्थान अनुसार कुन उम्मेदवारले कति भोट ल्याए हेर्नुहोस्:</p>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-pink-50/50 p-4 rounded-2xl border border-pink-100">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">प्रदेश छान्नुहोस्</label>
                    <select
                      value={filterProvince}
                      onChange={(e) => { setFilterProvince(e.target.value); setFilterDistrict(''); setFilterLocalBody(''); }}
                      className="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm bg-white"
                    >
                      <option value="">-- सबै प्रदेश (राष्ट्रिय) --</option>
                      {Object.keys(NEPAL_DATA).map(p => (
                        <option key={p} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">जिल्ला छान्नुहोस्</label>
                    <select
                      value={filterDistrict}
                      disabled={!filterProvince}
                      onChange={(e) => { setFilterDistrict(e.target.value); setFilterLocalBody(''); }}
                      className="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm bg-white disabled:bg-slate-100"
                    >
                      <option value="">-- सबै जिल्ला --</option>
                      {filterProvince && Object.keys(NEPAL_DATA[filterProvince] || {}).map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">नगरपालिका / गाउँपालिका छान्नुहोस्</label>
                    <select
                      value={filterLocalBody}
                      disabled={!filterDistrict}
                      onChange={(e) => setFilterLocalBody(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-pink-200 text-sm bg-white disabled:bg-slate-100"
                    >
                      <option value="">-- सबै पालिका --</option>
                      {filterDistrict && (NEPAL_DATA[filterProvince]?.[filterDistrict] || []).map(l => (
                        <option key={l} value={l}>{l}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="mt-4 flex justify-between items-center">
                  <span className="text-sm font-bold text-slate-600">
                    {filterLocalBody ? `${filterLocalBody} को नतिजा` : filterDistrict ? `${filterDistrict} जिल्लाको नतिजा` : filterProvince ? `${filterProvince} को नतिजा` : 'समग्र राष्ट्रिय नतिजा'}
                  </span>
                  <span className="text-xs bg-pink-100 text-pink-700 font-extrabold px-3 py-1 rounded-full">
                    कुल खसेको मत: {totalFilteredVotes}
                  </span>
                </div>
              </div>

              {totalFilteredVotes === 0 ? (
                <div className="text-center py-10 text-slate-400">
                  यो पालिका/क्षेत्रमा अहिलसम्म कुनै पनि भोट खसेको छैन।
                </div>
              ) : (
                <div className="space-y-4">
                  {candidates.map(cand => {
                    const count = getCandidateFilteredCount(cand.id);
                    const percent = totalFilteredVotes > 0 ? ((count / totalFilteredVotes) * 100).toFixed(1) : 0;
                    return (
                      <div key={cand.id} className="space-y-1.5 bg-pink-50/30 p-3.5 rounded-2xl border border-pink-100">
                        <div className="flex justify-between items-center font-bold text-sm">
                          <span className="flex items-center space-x-3">
                            {cand.photo ? (
                              <img src={cand.photo} className="w-8 h-8 rounded-full object-cover border border-pink-400" />
                            ) : (
                              <span className="text-xl">{cand.symbol}</span>
                            )}
                            <div>
                              <span className="text-slate-800">{cand.name}</span>
                              <span className="text-xs text-pink-600 ml-2">({cand.party})</span>
                            </div>
                          </span>
                          <span className="text-pink-700 font-extrabold">{count} मत ({percent}%)</span>
                        </div>
                        <div className="w-full bg-slate-200 h-3.5 rounded-full overflow-hidden">
                          <div
                            className="bg-gradient-to-r from-pink-500 to-rose-600 h-full transition-all duration-500"
                            style={{ width: `${percent}%` }}
                          ></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
